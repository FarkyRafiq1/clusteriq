name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pandas: ["pandas>=2.2,<3", "pandas>=3,<4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pip install "${{ matrix.pandas }}"
      - run: python -m pytest clusteriq_engine/tests/ -q
